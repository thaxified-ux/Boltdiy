<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one column. The road strip sits on top like a lit window, an always-on HUD under it, then tabbed panels. One committed night look. */
:root{
  --night:#0d1317; --panel:#141c21; --raise:#1b262c; --line:#2b3a42;
  --paper:#ece4d0; --muted:#97a39d; --lamp:#f3b44a; --lamp-ink:#2a1c06;
  --good:#7fd38b; --bad:#ff8070;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font:16px/1.45 var(--body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:700 1.7rem/1 var(--display);margin:0;letter-spacing:.02em;color:var(--lamp)}
.tag{color:var(--muted);font-size:.9rem}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;border-color:var(--line)}
.btn.small{padding:5px 9px;font-size:.85rem}

.road{position:relative;border:2px solid #000;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 10px 30px -12px rgba(243,180,74,.25)}
.road canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.roadhud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;gap:8px;padding:6px 9px;font:500 .8rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none}
.roadhud .zone{color:var(--lamp)}
.exitstrip{position:absolute;right:8px;bottom:8px;display:none}

.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lvl{font:700 1.05rem/1 var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.xpbar{height:10px;background:#0a0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#c88a2c,var(--lamp));width:0}
.purse{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.coin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lamp);box-shadow:inset -2px -2px 0 #b07a22;margin-right:5px;vertical-align:-1px}
.hudrow2{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
.hp{flex:1 1 160px;display:flex;align-items:center;gap:8px;min-width:0}
.hpbar{flex:1;height:8px;background:#0a0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good);width:100%}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--raise);color:var(--paper)}
.pill.on{border-color:var(--lamp);color:var(--lamp)}
.pts{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 11px;font:500 1rem/1 var(--display);color:var(--muted);white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--lamp)}
.tab .dot{position:absolute;top:6px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--lamp)}

.panel{display:flex;flex-direction:column;gap:14px;min-height:300px}
h2{font:700 1.1rem/1.2 var(--display);margin:0;letter-spacing:.03em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}

.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.paths{grid-template-columns:minmax(0,1fr)}}
.path{text-align:left;background:var(--raise);border:2px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.path b{font:700 1rem/1 var(--display)}
.path small{color:var(--muted);font-size:.84rem;line-height:1.35}
.path[aria-pressed="true"]{border-color:var(--lamp);background:#2a2110}
.path[aria-pressed="true"] b{color:var(--lamp)}

.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--raise);border:2px solid var(--rc,var(--line));border-radius:6px;padding:8px 4px;min-width:0}
.slot.empty{border-style:dashed;opacity:.7}
.slot.sel{box-shadow:0 0 0 2px var(--lamp)}
.slot img,.cell img,.icon{width:36px;height:36px;image-rendering:pixelated}
.slot .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gs{font:500 .78rem/1 var(--display);color:var(--rc,var(--muted))}

.stats{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-weight:700}

.attr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.attr:first-of-type{border-top:0}
.attr b{font-family:var(--display);font-weight:500;letter-spacing:.03em}
.attr small{display:block;color:var(--muted);font-size:.82rem}
.attr .val{font:700 1.05rem/1 var(--body);min-width:2.5ch;text-align:right}
.plus{width:34px;height:34px;border-radius:6px;border:1px solid var(--lamp);background:var(--raise);color:var(--lamp);font:700 1.2rem/1 var(--display)}
.plus:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}

.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;background:var(--raise);border:2px solid var(--rc,var(--line));border-radius:6px;display:grid;place-items:center;position:relative;padding:0}
.cell.empty{border-style:dashed;border-color:#22313a;cursor:default}
.cell.sel{box-shadow:0 0 0 2px var(--lamp)}
.cell .up{position:absolute;top:2px;right:3px;font:700 .75rem/1 var(--display);color:var(--good)}
.cell .new{position:absolute;bottom:2px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--lamp)}

.item{display:flex;flex-direction:column;gap:8px;border:2px solid var(--rc);border-radius:8px;padding:10px;background:var(--raise);min-width:0}
.item header{display:flex;gap:10px;align-items:center}
.item h3{margin:0;font:700 1rem/1.2 var(--display);color:var(--rc);text-wrap:balance}
.item .meta{font-size:.82rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 12px;font-variant-numeric:tabular-nums;font-size:.92rem}
.cmp .k{color:var(--muted)}
.cmp .v{text-align:right;font-weight:700}
.cmp .d{text-align:right;min-width:5ch}
.good{color:var(--good)} .bad{color:var(--bad)}
.verdict{font-weight:700;margin:0}
.hint{color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:8px;padding:12px;margin:0}
.el{font-weight:700}

.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fol{border:2px solid var(--rc);border-radius:8px;background:var(--raise);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fol header{display:flex;gap:10px;align-items:center}
.fol canvas{width:60px;height:60px;image-rendering:pixelated;flex:none;background:#0f161a;border-radius:4px}
.fol h3{margin:0;font:700 1rem/1.15 var(--display);color:var(--rc)}
.fol .meta{font-size:.82rem;color:var(--muted)}
.fol p{margin:0;font-size:.9rem}
.tagpill{font:500 .72rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--lamp);color:var(--lamp);border-radius:999px;padding:3px 7px}
.partybar{display:flex;gap:6px;flex-wrap:wrap}
.pslot{min-width:110px;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;font-size:.85rem;color:var(--muted)}
.pslot.on{border-style:solid;border-color:var(--rc);color:var(--paper)}

.tree{position:relative;aspect-ratio:1;width:100%;max-width:520px;margin:0 auto}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:8px;border:2px solid var(--line);background:#11181c;color:var(--muted);font:700 .62rem/1.05 var(--display);padding:2px;display:grid;place-items:center;text-align:center;overflow:hidden;hyphens:auto;overflow-wrap:normal}
.node.owned{border-color:var(--lamp);background:#2a2110;color:var(--lamp);box-shadow:0 0 12px -2px rgba(243,180,74,.55)}
.node.avail{border-color:#6c7f88;color:var(--paper)}
.node.sel{outline:2px solid var(--paper);outline-offset:2px}

.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.zone{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.zone .sky{height:54px;position:relative}
.zone .sky span{position:absolute;left:10px;bottom:6px;font:700 1rem/1 var(--display);text-shadow:0 1px 0 #000}
.zone .body{padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;flex:1}
.zone.locked .sky{filter:grayscale(1) brightness(.5)}
.status{font:500 .78rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status.cur{color:var(--lamp)}
.foe{display:flex;gap:8px;align-items:center}
.foe img{height:42px;width:auto;image-rendering:pixelated;flex:none}
.zone.locked .foe img{filter:brightness(0)}

.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.feat{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px}
.feat.done{border-color:var(--lamp)}
.feat b{font:700 .98rem/1.1 var(--display)}
.feat.claimed b{color:var(--lamp)}
.prog{height:6px;background:#0a0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lamp)}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto;font-size:.9rem}
.log li{display:flex;gap:8px;border-bottom:1px solid #1e2a30;padding:4px 0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
label.chk{display:flex;gap:8px;align-items:center}
select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

.overlay{position:fixed;inset:0;background:rgba(5,8,10,.78);display:grid;place-items:center;padding:20px;z-index:20}
.away{max-width:420px;width:100%;background:var(--panel);border:2px solid var(--lamp);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.away h2{color:var(--lamp);text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;background:var(--raise)}
.tiles b{display:block;font:700 1.2rem/1.1 var(--body);font-variant-numeric:tabular-nums}
.tiles small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.found{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.found li{display:flex;gap:8px;align-items:center;font-size:.9rem}
.found img{width:24px;height:24px;image-rendering:pixelated}

body.strip .top,body.strip .tabs,body.strip .panel{display:none}
body.strip .wrap{max-width:1400px}
body.strip .exitstrip{display:block}
@media (prefers-reduced-motion:reduce){.node.owned{box-shadow:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Lantern Road</h1><span class="tag">An idle road-battler that keeps walking while you work.</span></div>
    <button class="btn" id="stripBtn" type="button" title="Hide the menus and keep only the road, for a pinned tab or side window">Strip mode</button>
  </header>

  <section class="road" aria-label="The road">
    <canvas id="cv" width="960" height="360"></canvas>
    <div class="roadhud"><span id="hudStage">Stage 1 · Wave 1/10</span><span class="zone" id="hudZone">Mossbarrow Lane</span></div>
    <button class="btn small exitstrip" id="exitStrip" type="button">Show menus</button>
  </section>

  <section class="hud" aria-label="Hero status">
    <span class="lvl" id="hudLvl">Lv 1</span>
    <div class="xpbar" title="Experience"><i id="hudXp"></i></div>
    <div class="purse"><span><span class="coin"></span><span id="hudGold">0</span></span></div>
    <div class="hudrow2">
      <div class="hp"><span>HP</span><div class="hpbar"><i id="hudHp"></i></div><span id="hudHpTxt" style="font-variant-numeric:tabular-nums">100/100</span></div>
      <button class="pill" id="farmBtn" type="button" title="Stay on this stage instead of pushing forward">Farming: off</button>
      <button class="pill pts" id="ptsBtn" type="button" hidden>0 points to spend</button>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Menus">
    <button class="tab" role="tab" data-tab="hero" id="tab-hero">Hero</button>
    <button class="tab" role="tab" data-tab="bag" id="tab-bag">Bag</button>
    <button class="tab" role="tab" data-tab="company" id="tab-company">Company</button>
    <button class="tab" role="tab" data-tab="talents" id="tab-talents">Waystones</button>
    <button class="tab" role="tab" data-tab="map" id="tab-map">Map</button>
    <button class="tab" role="tab" data-tab="feats" id="tab-feats">Feats</button>
    <button class="tab" role="tab" data-tab="journal" id="tab-journal">Journal</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>
</div>
<div class="overlay" id="overlay" hidden><div class="away" id="awayCard" role="dialog" aria-modal="true" aria-labelledby="awayTitle"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const W = 240, H = 90, GY = 72, HX = 78, WAVES = 10, BAG_MAX = 30, ROSTER_MAX = 12;
const SAVE_KEY = 'lantern-road-v1';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9);
function fmt(n) {
  if (!isFinite(n)) return '0';
  const a = Math.abs(n);
  if (a < 10 && n % 1) return n.toFixed(1);
  if (a < 1e4) return Math.round(n).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp'];
  let i = -1, v = a;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return (n < 0 ? '-' : '') + (v < 100 ? v.toFixed(1) : Math.round(v)) + u[i];
}
function dur(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Data ---------- */
const RAR = [
  { n: 'Worn', col: '#8f8f86', m: 0.7, aff: 0, w: 38 },
  { n: 'Common', col: '#d8d2c2', m: 1.0, aff: 1, w: 30 },
  { n: 'Fine', col: '#7fd38b', m: 1.3, aff: 1, w: 18 },
  { n: 'Rare', col: '#5fb0ff', m: 1.7, aff: 2, w: 9.5 },
  { n: 'Epic', col: '#c58bff', m: 2.2, aff: 3, w: 3.8 },
  { n: 'Mythic', col: '#ff8f45', m: 3.0, aff: 4, w: 0.7 },
  { n: 'Heirloom', col: '#ffd84a', m: 3.8, aff: 5, w: 0.15 },
  { n: 'Starborn', col: '#7ff0ff', m: 5.0, aff: 5, w: 0.03 },
];
const ELEM = {
  phys: { n: 'Physical', col: '#dfe6ea' }, fire: { n: 'Fire', col: '#ff8a3d' }, frost: { n: 'Frost', col: '#8fd8ff' },
  shadow: { n: 'Shadow', col: '#c08cff' }, radiant: { n: 'Radiant', col: '#ffe680' },
};
const STAT = {
  hp: { l: 'Max HP', p: 0, base: 18 }, dmg: { l: 'Damage', p: 0, base: 3 }, def: { l: 'Defense', p: 0, base: 3 },
  regen: { l: 'Regen / sec', p: 0, base: 0.6 }, aspd: { l: 'Attack speed', p: 1, base: 3 }, crit: { l: 'Crit chance', p: 1, base: 1.2 },
  critd: { l: 'Crit damage', p: 1, base: 8 }, dodge: { l: 'Dodge', p: 1, base: 1 }, block: { l: 'Block', p: 1, base: 1.5 },
  ls: { l: 'Lifesteal', p: 1, base: 0.6 }, gold: { l: 'Gold find', p: 1, base: 5 }, xp: { l: 'XP gain', p: 1, base: 5 }, drop: { l: 'Drop chance', p: 1, base: 5 },
  rFire: { l: 'Fire resist', p: 1, base: 4 }, rFrost: { l: 'Frost resist', p: 1, base: 4 }, rShadow: { l: 'Shadow resist', p: 1, base: 4 },
  rAll: { l: 'All resists', p: 1, base: 2 }, elem: { l: 'Elemental damage', p: 1, base: 5 }, comp: { l: 'Company power', p: 1, base: 5 },
};
const SLOTS = ['weapon', 'helm', 'armor', 'gloves', 'belt', 'boots', 'cloak', 'amulet', 'ring', 'charm'];
const SLOT_LABEL = { weapon: 'Weapon', helm: 'Helm', armor: 'Armor', gloves: 'Gloves', belt: 'Belt', boots: 'Boots', cloak: 'Cloak', amulet: 'Amulet', ring: 'Ring', charm: 'Charm' };
const SLOT_MAIN = {
  weapon: { dmg: 6 }, helm: { hp: 30, def: 2 }, armor: { def: 5, hp: 20 }, gloves: { aspd: 3, crit: .8 }, belt: { hp: 22, regen: .6 },
  boots: { dodge: 1.5, hp: 14 }, cloak: { def: 3, rAll: 3 }, amulet: { dmg: 3, critd: 8 }, ring: { crit: 1.5, critd: 10 }, charm: { gold: 6, comp: 4 },
};
const PATHS = {
  blade: { n: 'Blade', d: 'Fights up close. +20% max HP, +15% defense.', range: 18, mult: 1, elem: 'phys', weapons: ['Shortsword', 'Sabre', 'Warpick', 'Hatchet', 'Falchion'] },
  bow: { n: 'Bow', d: 'Shoots from range, so foes take hits before they reach you. +15% attack speed, 90% damage.', range: 110, mult: .9, elem: 'phys', weapons: ['Shortbow', 'Longbow', 'Sling', 'Recurve'] },
  lamp: { n: 'Lamp', d: 'Casts radiant light from the lantern. Every bolt splashes 40% onto the other foes. 85% damage.', range: 85, mult: .85, elem: 'radiant', weapons: ['Wick Staff', 'Censer', 'Lamp Rod', 'Glimmer Wand'] },
};

function iconKey(it) { return it.slot === 'weapon' ? (it.path || 'blade') : it.slot; }
function icon(key, r) {

function save() {

function migrate(d) {
  if (!d || (d.v !== 1 && d.v !== 2)) return null;
  const s = Object.assign(fresh(), d);
  s.equip = Object.assign(emptyEquip(), d.equip || {});
  for (const it of [...Object.values(s.equip), ...s.bag]) if (it && it.slot === 'weapon' && !it.path) it.path = 'blade';
  if (d.v === 1) { s.bestR = d.best ? d.best.r : 0; s.v = 2; }

}

/* ---------- Stats ---------- */
function talentBonus() {
  const t = { hp: 0, dmg: 0, critd: 0, crit: 0, ls: 0, def: 0, block: 0, regen: 0, aspd: 0, dodge: 0, gold: 0, xp: 0, drop: 0, luck: 0, rFire: 0, rFrost: 0, rShadow: 0, comp: 0, elem: 0, slots: 0 };
  for (const id in S.talents) if (S.talents[id] && TAL[id]) t[TAL[id].k] += TAL[id].v;
  return t;
}
const ownedCount = () => TALENTS.filter(t => S.talents[t.id]).length;
const renown = () => Object.keys(S.feats).length;
const partySlots = () => 1 + (S.maxStage >= 6) + (S.maxStage >= 16) + talentBonus().slots;
const partyMembers = () => S.party.map(id => S.roster.find(f => f.id === id)).filter(Boolean);
function compPower(gearComp, t) { return 1 + ((gearComp || 0) + t.comp) / 100; }
function folPower(f, cp) { return 5 * Math.pow(1.13, f.lvl - 1) * RAR[f.r].m * cp; }

function heroStats(eq) {
  eq = eq || S.equip;
  const a = S.attrs, t = talentBonus(), g = {}, P = PATHS[S.path];
  for (const s of SLOTS) {
    const it = eq[s]; if (!it) continue;
    for (const k in it.stats) {
      let v = it.stats[k];
      if (s === 'weapon' && k === 'dmg' && it.path !== S.path) v *= .5;
      g[k] = (g[k] || 0) + v;
    }
  }
  const G0 = k => g[k] || 0;
  const cp = compPower(G0('comp'), t);
  let fDef = 0, fBlock = 0, fHeal = 0, fGold = 0, fDrop = 0;
  for (const f of partyMembers()) {
    const p = folPower(f, cp);
    if (f.kind === 'warden') { fDef += p * .6; fBlock += 3 + f.r; }
    if (f.kind === 'herb') fHeal += p * .5;
    if (f.kind === 'lamp') { fGold += 10 + f.r * 5; fDrop += 5 + f.r * 3; }
  }
  const ren = renown();
  const hp = (100 + a.vit * 14 + (S.level - 1) * 6 + G0('hp')) * (1 + t.hp) * (S.path === 'blade' ? 1.2 : 1);
  const w = eq.weapon;
  const elem = (w && w.path === S.path && w.elem) || P.elem;
  const rAll = G0('rAll');
  return {
    hp, elem, cp,
    dmg: (10 + a.mig * 2.4 + (S.level - 1) + G0('dmg')) * (1 + t.dmg) * P.mult * (1 + ren * .02) * (elem !== 'phys' ? 1 + (G0('elem') + t.elem) / 100 : 1),
    aspd: Math.min(4, (1 + a.agi * .012 + G0('aspd') / 100 + t.aspd) * (S.path === 'bow' ? 1.15 : 1)),
    crit: Math.min(75, 5 + a.for * .4 + G0('crit') + t.crit), critd: 150 + G0('critd') + t.critd,
    def: ((G0('def') + a.vit * .5) * (1 + t.def) + fDef) * (S.path === 'blade' ? 1.15 : 1),
    dodge: Math.min(50, a.agi * .25 + G0('dodge') + t.dodge),
    block: Math.min(60, G0('block') + t.block + fBlock), regen: hp * .004 + G0('regen') + hp * t.regen + fHeal,
    ls: G0('ls') + t.ls, gold: G0('gold') + t.gold * 100 + a.for + fGold + ren * 2, xp: G0('xp') + t.xp * 100, drop: G0('drop') + t.drop * 100 + fDrop, luck: t.luck,
    res: { phys: 0, fire: Math.min(75, G0('rFire') + rAll + t.rFire), frost: Math.min(75, G0('rFrost') + rAll + t.rFrost), shadow: Math.min(75, G0('rShadow') + rAll + t.rShadow) },
    range: P.range,
  };
}
function stats() { if (dirtyStats) { ST = heroStats(); dirtyStats = false; } return ST; }
function rating(st) {
  const dps = st.dmg * st.aspd * (1 + st.crit / 100 * (st.critd / 100 - 1)) * (1 + st.ls / 200) * (S.path === 'lamp' ? 1.25 : 1);
  const r = (st.res.fire + st.res.frost + st.res.shadow) / 3;
  const ehp = st.hp * (1 + st.def / 100) / (1 - st.dodge / 100) / (1 - st.block / 200) * (1 + r / 200) + st.regen * 20;
  return dps * Math.sqrt(ehp) * (st.elem !== 'phys' ? 1.05 : 1) * (1 + (st.cp - 1) * .3) * (1 + (st.gold + st.drop) / 2000);
}
function ratingWith(item) { const eq = Object.assign({}, S.equip, { [item.slot]: item }); return rating(heroStats(eq)); }

/* ---------- Items ---------- */
const flatScale = il => Math.pow(1.13, il - 1);
const pctScale = il => 1 + Math.min(il, 60) * .03;
const roundStat = (k, v) => STAT[k].p || v < 10 ? Math.round(v * 10) / 10 : Math.round(v);
function rollRarity(luck) {
  const ws = RAR.map((r, i) => r.w * Math.pow(1 + .6 * luck, i));
  let t = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ws.length; i++) { t -= ws[i]; if (t <= 0) return i; }
  return 0;
}
function makeItem(il, r, slot, path) {
  slot = slot || pick(SLOTS);

function renderJournal() {
  const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h'; };
  const logs = S.log.length ? S.log.map(l => `<li><time>${ago(l.t)}</time><span ${l.c ? `style="color:${l.c}"` : ''}>${esc(l.m)}</span></li>`).join('') : '<li class="sub">Nothing yet. Your story starts on Mossbarrow Lane.</li>';
  const opts = ['Off', 'Worn', 'Common and below', 'Fine and below', 'Rare and below', 'Epic and below'].map((n, i) => `<option value="${i}" ${S.autoSell === i ? 'selected' : ''}>${n}</option>`).join('');
  panel.innerHTML = `<div class="split">
    <div class="card"><h2>Journal</h2><ul class="log">${logs}</ul></div>
    <div class="card"><h2>Settings</h2>
      <label for="autoSell">Auto-sell drops (upgrades are always kept)</label><select id="autoSell">${opts}</select>
      <label class="chk"><input type="checkbox" id="autoSpend" ${S.autoSpend ? 'checked' : ''}> Spend attribute points automatically</label>
      <h2>Records</h2><dl class="stats">
        <dt>Enemies defeated</dt><dd>${fmt(S.kills)}</dd><dt>Times fallen</dt><dd>${fmt(S.deaths)}</dd>
        <dt>Furthest stage</dt><dd>${S.maxStage}</dd><dt>Travellers recruited</dt><dd>${S.recruited}</dd><dt>Time on the road</dt><dd>${dur(S.played)}</dd>
        <dt>Best find</dt><dd ${S.best ? `style="color:${RAR[S.best.r].col}"` : ''}>${S.best ? esc(S.best.name) + ' · GS ' + S.best.gs : '–'}</dd></dl>
      <p class="sub">Progress is saved in this browser only.</p>
      ${confirmReset ? `<div class="row"><span class="bad verdict">Erase this hero and start over?</span><button class="btn small" data-act="reset2">Erase</button><button class="btn small primary" data-act="reset0">Keep playing</button></div>`
        : '<div class="row"><button class="btn small" data-act="reset1">Start a new journey…</button></div>'}
    </div></div>`;
}
function renderPanel() {
  dirtyPanel = false;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  ({ hero: renderHero, bag: renderBag, company: renderCompany, talents: renderTalents, map: renderMap, feats: renderFeats, journal: renderJournal }[S.tab] || renderHero)();
  markTabs();
}

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  S.tab = b.dataset.tab; confirmReset = false; confirmDismiss = null; renderPanel();
});
panel.addEventListener('change', e => {
  if (e.target.id === 'autoSell') S.autoSell = +e.target.value;
  if (e.target.id === 'autoSpend') { S.autoSpend = e.target.checked; if (S.autoSpend) autoSpend(); updateHud(); }
  save();
});
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a !== 'dismiss2' && a !== 'dismiss1') confirmDismiss = null;
  if (a === 'selbag') { selBag = selBag === id ? null : id; const it = S.bag.find(x => x.id === id); if (it) it.isNew = false; }
  if (a === 'equip') { const it = S.bag.find(x => x.id === id); if (it) { equip(it); selBag = null; } }
  if (a === 'sell') { const it = S.bag.find(x => x.id === id); if (it) { sell(it); selBag = null; } }
  if (a === 'sellbelow') { const r = +b.dataset.r; let g = 0, n = 0; S.bag = S.bag.filter(it => { if (it.r < r && !isUpgrade(it)) { g += value(it); n++; return false; } return true; }); S.gold += g; if (n) log(`Sold ${n} item${n > 1 ? 's' : ''} for ${fmt(g)} gold.`); selBag = null; }
  if (a === 'autoequip') { const n = autoEquip(); log(n ? `Equipped ${n} upgrade${n > 1 ? 's' : ''}.` : 'Nothing in the bag beats your current gear.'); S.bag.forEach(i => { i.isNew = false; }); }
  if (a === 'seleq') selEq = selEq === b.dataset.slot ? null : b.dataset.slot;
  if (a === 'tobag') S.tab = 'bag';
  if (a === 'unequip') { const s = b.dataset.slot; if (S.bag.length < BAG_MAX && S.equip[s]) { S.bag.push(S.equip[s]); S.equip[s] = null; dirtyStats = true; selEq = null; } else log('Bag is full. Sell something first.'); }
  if (a === 'attr' && S.points > 0) { S.attrs[b.dataset.k]++; S.points--; dirtyStats = true; }
  if (a === 'path') setPath(b.dataset.p);
  if (a === 'seltal') selTal = id;
  if (a === 'unlock') { const c = talCost(); if (S.gold >= c && talAvail(TAL[id]) && !S.talents[id]) { S.gold -= c; S.talents[id] = true; dirtyStats = true; log(`Unlocked the ${TAL[id].n} waystone.`, '#f3b44a'); } }
  if (a === 'travel') { S.stage = +b.dataset.s; S.wave = 1; G.enemies = []; G.proj = []; G.phase = 'walk'; G.walkT = 1; banner(`Stage ${S.stage} · ${ZONES[zoneOf(S.stage)].name}`); }
  if (a === 'farm') S.farm = !S.farm;
  if (a === 'walk') { if (partyMembers().length < partySlots() && !S.party.includes(id)) { S.party.push(id); dirtyStats = true; } }
  if (a === 'rest') { S.party = S.party.filter(x => x !== id); dirtyStats = true; }
  if (a === 'train') { const f = S.roster.find(x => x.id === id), c = f && trainCost(f); if (f && S.gold >= c) { S.gold -= c; f.lvl++; dirtyStats = true; } }
  if (a === 'dismiss1') confirmDismiss = id;
  if (a === 'dismiss2') { const f = S.roster.find(x => x.id === id); if (f) { S.roster = S.roster.filter(x => x.id !== id); S.party = S.party.filter(x => x !== id); dirtyStats = true; log(`${f.name} went their own way.`); } confirmDismiss = null; }
  if (a === 'claim') { const f = FEATS.find(x => x.id === id); if (f && !S.feats[id] && featDone(f)) { const g = Math.round(goldPer(S.maxStage) * 25); S.feats[id] = true; S.gold += g; dirtyStats = true; log(`Feat claimed: ${f.n}. +1 renown, +${fmt(g)} gold.`, '#f3b44a'); } }
  if (a === 'reset1') confirmReset = true;
  if (a === 'reset0') confirmReset = false;
  if (a === 'reset2') { S = newGame(); confirmReset = false; selBag = selEq = selTal = null; dirtyStats = true; resetRuntime(); }
  save(); updateHud(); renderPanel();
});
$('#farmBtn').addEventListener('click', () => { S.farm = !S.farm; log(S.farm ? `Farming Stage ${S.stage}.` : 'Pushing forward again.'); save(); updateHud(); if (S.tab === 'map') renderPanel(); });
$('#ptsBtn').addEventListener('click', () => { S.tab = 'hero'; renderPanel(); });

/* Strip mode: only the road, for a pinned tab or a narrow side window */
let wake = null;
async function setStrip(on) {
  document.body.classList.toggle('strip', on);
  try { if (on && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); else if (wake) { await wake.release(); wake = null; } } catch (e) { wake = null; }
  sizeCanvas();
}
$('#stripBtn').addEventListener('click', () => setStrip(true));
$('#exitStrip').addEventListener('click', () => setStrip(false));

/* ---------- Offline progress ---------- */
function simulateAway(sec) {
  sec = Math.min(sec, 12 * 3600);
  const st = stats(), s = S.stage, z = ZONES[zoneOf(s)];
  const avgRes = [...z.foes].reduce((a, f) => a + resMult(f, st.elem), 0) / z.foes.length;
  let dps = st.dmg * st.aspd * (1 + st.crit / 100 * (st.critd / 100 - 1)) * avgRes * (S.path === 'lamp' ? 1.25 : 1);
  for (const f of partyMembers()) { const Kd = KINDS[f.kind]; if (Kd.atk) dps += folPower(f, st.cp) * z.foes.reduce((a, o) => a + resMult(o, Kd.el), 0) / z.foes.length; }
  const avgHp = enemyBase(s, 5, false).hp;
  const waveTime = 1.3 + 1.55 * avgHp / dps + .6;
  const kills = Math.floor(sec / waveTime * 1.55 * .9);
  if (kills < 1) return null;
  const gold = kills * goldPer(s) * (1 + st.gold / 100);
  const lv0 = S.level;
  S.gold += gold; S.kills += kills;
  addXp(kills * xpPer(s) * (1 + st.xp / 100));
  const drops = Math.min(60, Math.floor(kills * .16 * (1 + st.drop / 100)));
  const kept = []; let sold = 0, soldGold = 0;
  for (let i = 0; i < drops; i++) {
    const it = makeItem(s, rollRarity(st.luck));
    const before = S.gold, res = gainItem(it, true);
    if (res === 'kept') kept.push(it); else { sold++; soldGold += S.gold - before; }
  }
  const joined = [];
  const tries = Math.min(3, Math.floor(kills / 400));
  for (let i = 0; i < tries; i++) if (Math.random() < .5) { const f = recruit(true); if (f) joined.push(f); }
  log(`While away (${dur(sec)}): ${fmt(kills)} enemies, ${fmt(gold)} gold, ${kept.length} items kept${joined.length ? `, ${joined.length} new follower${joined.length > 1 ? 's' : ''}` : ''}.`);
  return { sec, kills, gold: gold + soldGold, levels: S.level - lv0, kept, sold, joined };
}
function showAway(r) {
  const card = $('#awayCard');
  const list = r.kept.slice().sort((a, b) => b.r - a.r || b.gs - a.gs).slice(0, 8)
    .map(it => `<li><img alt="" src="${itemIcon(it)}"><span style="color:${RAR[it.r].col}">${esc(it.name)}</span><span class="sub">GS ${it.gs}</span></li>`).join('');
  const joined = r.joined.map(f => `<li><span style="color:${RAR[f.r].col}">${esc(f.name)}</span><span class="sub">${RAR[f.r].n} ${KINDS[f.kind].n}</span></li>`).join('');
  card.innerHTML = `<h2 id="awayTitle">While you were away</h2>
    <p class="sub" style="text-align:center">Your wanderer kept fighting on Stage ${S.stage}.</p>
    <div class="tiles"><div><b>${dur(r.sec)}</b><small>Time away</small></div><div><b>${fmt(r.kills)}</b><small>Enemies</small></div>
      <div><b>+${r.levels}</b><small>Levels</small></div><div><b>+${fmt(r.gold)}</b><small>Gold</small></div></div>
    ${r.kept.length ? `<p class="sub">${r.kept.length} item${r.kept.length > 1 ? 's' : ''} added to your bag${r.sold ? `, ${r.sold} sold for gold (auto-sell or full bag)` : ''}.</p><ul class="found">${list}</ul>` : `<p class="sub">${r.sold ? r.sold + ' drops were sold for gold.' : 'No gear dropped this time.'}</p>`}
    ${r.joined.length ? `<p class="sub">New travellers followed your light:</p><ul class="found">${joined}</ul>` : ''}
    <button class="btn primary" id="awayOk" type="button">Back to the road</button>`;
  $('#overlay').hidden = false;
  $('#awayOk').focus();
  $('#awayOk').onclick = () => { $('#overlay').hidden = true; dirtyPanel = true; };
}
function catchUp() {
  const gap = (Date.now() - S.lastSeen) / 1000;
  if (gap > 60) { const r = simulateAway(gap); if (r) showAway(r); }
  S.lastSeen = Date.now();
}
let last = performance.now();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { catchUp(); save(); last = performance.now(); } });
window.addEventListener('pagehide', save);
window.addEventListener('resize', sizeCanvas);

/* ---------- Loop ---------- */
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  update(dt); draw();
  G.hudT += dt; if (G.hudT > .2) { G.hudT = 0; updateHud(); if (dirtyPanel && $('#overlay').hidden) renderPanel(); }
  G.saveT += dt; if (G.saveT > 5) { G.saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function newGame() {
  S = fresh();
  S.equip.weapon = makeItem(1, 1, 'weapon', 'blade'); S.equip.weapon.isNew = false; S.equip.weapon.name = 'Plain Shortsword';
  log('A wanderer lights the lantern and sets out down Mossbarrow Lane.');
  return S;
}
function start(data) {
  const saved = (data && data.S) ? migrate(data.S) : load();
  if (saved) S = saved; else newGame();
  dirtyStats = true;
  resetRuntime();
  sizeCanvas();
  if (!data || !data.S) catchUp();
  updateHud(); renderPanel();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ S })); } catch (e) { /* ignore */ } }
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
