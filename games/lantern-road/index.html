<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one column. The road strip sits on top like a lit window, an always-on HUD under it, then tabbed panels. One committed night look. */
:root{
  --night:#0d1317; --panel:#141c21; --raise:#1b262c; --line:#2b3a42;
  --paper:#ece4d0; --muted:#97a39d; --lamp:#f3b44a; --lamp-ink:#2a1c06;
  --good:#7fd38b; --bad:#ff8070;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font:16px/1.45 var(--body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:700 1.7rem/1 var(--display);margin:0;letter-spacing:.02em;color:var(--lamp)}
.tag{color:var(--muted);font-size:.9rem}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;border-color:var(--line)}
.btn.small{padding:5px 9px;font-size:.85rem}

.road{position:relative;border:2px solid #000;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 10px 30px -12px rgba(243,180,74,.25)}
.road canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.roadhud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;gap:8px;padding:6px 9px;font:500 .8rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none}
.roadhud .zone{color:var(--lamp);text-align:right}
.roadhud span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:520px){.roadhud{font-size:.58rem;letter-spacing:.03em;padding:5px 7px}}
.exitstrip{position:absolute;right:8px;bottom:8px;display:none}

.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lvl{font:700 1.05rem/1 var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.xpbar{position:relative;height:20px;background:#0a0f12;border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
.xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 .74rem/1 var(--body);font-variant-numeric:tabular-nums;color:var(--paper);text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;overflow:hidden;padding:0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#c88a2c,var(--lamp));width:0}
.purse{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.coin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lamp);box-shadow:inset -2px -2px 0 #b07a22;margin-right:5px;vertical-align:-1px}
.hudrow2{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
.hp{flex:1 1 160px;display:flex;align-items:center;gap:8px;min-width:0}
.hpbar{flex:1;height:8px;background:#0a0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good);width:100%}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--raise);color:var(--paper)}
.pill.on{border-color:var(--lamp);color:var(--lamp)}
.pts{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 11px;font:500 1rem/1 var(--display);color:var(--muted);white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--lamp)}
.tab .dot{position:absolute;top:6px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--lamp)}

.panel{display:flex;flex-direction:column;gap:14px;min-height:300px}
h2{font:700 1.1rem/1.2 var(--display);margin:0;letter-spacing:.03em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}

.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.paths{grid-template-columns:minmax(0,1fr)}}
.path{text-align:left;background:var(--raise);border:2px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.path b{font:700 1rem/1 var(--display)}
.path small{color:var(--muted);font-size:.84rem;line-height:1.35}
.path[aria-pressed="true"]{border-color:var(--lamp);background:#2a2110}
.path[aria-pressed="true"] b{color:var(--lamp)}

.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--raise);border:2px solid var(--rc,var(--line));border-radius:6px;padding:8px 4px;min-width:0}
.slot.empty{border-style:dashed;opacity:.7}
.slot.sel{box-shadow:0 0 0 2px var(--lamp)}
.slot img,.cell img{width:76%;height:auto;image-rendering:pixelated}
.icon{width:40px;height:40px;image-rendering:pixelated}
.slot .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gs{font:500 .78rem/1 var(--display);color:var(--rc,var(--muted))}

.stats{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-weight:700}

.attr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.attr:first-of-type{border-top:0}
.attr b{font-family:var(--display);font-weight:500;letter-spacing:.03em}
.attr small{display:block;color:var(--muted);font-size:.82rem}
.attr .val{font:700 1.05rem/1 var(--body);min-width:2.5ch;text-align:right}
.plus{width:34px;height:34px;border-radius:6px;border:1px solid var(--lamp);background:var(--raise);color:var(--lamp);font:700 1.2rem/1 var(--display)}
.plus:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}

.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{background-image:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc,transparent) 42%,transparent) 0,transparent 68%)!important;aspect-ratio:1;max-width:100%;background:var(--raise);border:2px solid var(--rc,var(--line));border-radius:6px;display:grid;place-items:center;position:relative;padding:0}
.cell.empty{border-style:dashed;border-color:#22313a;cursor:default}
.cell.sel{box-shadow:0 0 0 2px var(--lamp)}
.cell .up{position:absolute;top:2px;right:3px;font:700 .75rem/1 var(--display);color:var(--good)}
.cell .new{position:absolute;bottom:2px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--lamp)}

.item{display:flex;flex-direction:column;gap:8px;border:2px solid var(--rc);border-radius:8px;padding:10px;background:var(--raise);min-width:0}
.item header{display:flex;gap:10px;align-items:center}
.item h3{margin:0;font:700 1rem/1.2 var(--display);color:var(--rc);text-wrap:balance}
.item .meta{font-size:.82rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 12px;font-variant-numeric:tabular-nums;font-size:.92rem}
.cmp .k{color:var(--muted)}
.cmp .v{text-align:right;font-weight:700}
.cmp .d{text-align:right;min-width:5ch}
.good{color:var(--good)} .bad{color:var(--bad)}
.verdict{font-weight:700;margin:0}
.hint{color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:8px;padding:12px;margin:0}
.el{font-weight:700}

.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fol{border:2px solid var(--rc);border-radius:8px;background:var(--raise);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fol header{display:flex;gap:10px;align-items:center}
.fol canvas{width:60px;height:60px;image-rendering:pixelated;flex:none;background:#0f161a;border-radius:4px}
.fol h3{margin:0;font:700 1rem/1.15 var(--display);color:var(--rc)}
.fol .meta{font-size:.82rem;color:var(--muted)}
.fol p{margin:0;font-size:.9rem}
.tagpill{font:500 .72rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--lamp);color:var(--lamp);border-radius:999px;padding:3px 7px}
.partybar{display:flex;gap:6px;flex-wrap:wrap}
.pslot{min-width:110px;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;font-size:.85rem;color:var(--muted)}
.pslot.on{border-style:solid;border-color:var(--rc);color:var(--paper)}

.tree{position:relative;aspect-ratio:1;width:100%;max-width:560px;margin:0 auto}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:10%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:6px;border:2px solid var(--line);background:#11181c;color:var(--muted);font:700 .62rem/1 var(--display);padding:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;overflow:hidden}
.node small{font-size:.5rem;letter-spacing:.02em;opacity:.85}
.node.major{border-width:3px;border-style:double}
.node.owned{border-color:var(--lamp);background:#2a2110;color:var(--lamp);box-shadow:0 0 12px -2px rgba(243,180,74,.55)}
.node.avail{border-color:#6c7f88;color:var(--paper)}
.node.sel{outline:2px solid var(--paper);outline-offset:2px}

.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.zone{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.zone .sky{height:54px;position:relative}
.zone .sky span{position:absolute;left:10px;bottom:6px;font:700 1rem/1 var(--display);text-shadow:0 1px 0 #000}
.zone .body{padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;flex:1}
.zone.locked .sky{filter:grayscale(1) brightness(.5)}
.status{font:500 .78rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status.cur{color:var(--lamp)}
.foe{display:flex;gap:8px;align-items:center}
.foe img{height:42px;width:auto;image-rendering:pixelated;flex:none}
.zone.locked .foe img{filter:brightness(0)}

.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.feat{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px}
.feat.done{border-color:var(--lamp)}
.feat b{font:700 .98rem/1.1 var(--display)}
.feat.claimed b{color:var(--lamp)}
.prog{height:6px;background:#0a0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lamp)}

.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ware{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ware.owned{border-color:var(--good)}
.ware.using{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp)}
.ware h3{margin:0;font:700 1rem/1.2 var(--display)}
.ware p{margin:0;font-size:.9rem;color:var(--muted)}
.ware .prev{height:56px;border-radius:6px;background:#0a0f12;display:grid;place-items:center;overflow:hidden}
.ware .prev canvas{height:48px;width:auto;image-rendering:pixelated}
.ware .row{margin-top:auto}
.hero-offer{border:2px solid var(--lamp);border-radius:10px;padding:14px;background:linear-gradient(135deg,#2a2110,var(--panel) 60%);display:flex;flex-direction:column;gap:8px}
.hero-offer h2{color:var(--lamp)}
.hero-offer ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.notice{border:1px dashed var(--lamp);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--paper);background:#1d1a10;margin:0}
.timer{font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.toasts{position:absolute;left:50%;top:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;z-index:2;width:max-content;max-width:90%}
.toast{background:rgba(13,19,23,.92);border:1px solid var(--lamp);border-radius:999px;padding:4px 12px;font-size:.8rem;display:flex;gap:6px;align-items:center;animation:toastIn 3.2s ease forwards}
.toast b{color:var(--lamp);font-family:var(--display);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
@keyframes toastIn{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.coach{display:flex;gap:10px;align-items:center;background:#2a2110;border:1px solid var(--lamp);border-radius:8px;padding:8px 10px;font-size:.92rem}
.coach span:nth-child(2){flex:1;min-width:0}
.coach .hand{width:22px;height:16px;flex:none;background:linear-gradient(var(--lamp),var(--lamp)) 0 6px/14px 4px no-repeat,linear-gradient(var(--lamp),var(--lamp)) 12px 3px/8px 10px no-repeat;animation:poke 1s ease-in-out infinite}
@keyframes poke{50%{transform:translateX(4px)}}
.tab.pulse{animation:pulse 1.2s ease-in-out infinite;border-radius:6px 6px 0 0}
@keyframes pulse{50%{background:rgba(243,180,74,.18);color:var(--lamp)}}
.attr .next{color:var(--good);font-variant-numeric:tabular-nums}
.foe.unknown img{filter:brightness(0) opacity(.7)}
html.big{font-size:112.5%}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.coach .hand,.tab.pulse{animation:none}}
.mats{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-variant-numeric:tabular-nums}
.mat{display:inline-flex;align-items:center;gap:6px}
.mat i{display:inline-block;width:10px;height:10px;transform:rotate(45deg);border-radius:1px}
.mat.shard i{background:#f3b44a;box-shadow:inset -2px -2px 0 #a8701e}
.mat.glass i{background:#7ff0ff;box-shadow:inset -2px -2px 0 #3a9ab0}
.forge-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.forge-row:first-of-type{border-top:0}
.forge-row img{width:32px;height:32px;image-rendering:pixelated}
.forge-row b{font-family:var(--display);font-weight:500;color:var(--rc)}
.forge-row small{display:block;color:var(--muted);font-size:.82rem}
.up-pips{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.up-pips i{width:5px;height:5px;background:#2b3a42}
.up-pips i.on{background:var(--lamp)}
.slotpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.slotpick button[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.nudge{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lamp);border-radius:8px;padding:8px 10px;font-size:.92rem}
.nudge span{flex:1 1 220px;min-width:0}
.daily{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daily .chest{width:34px;height:28px;flex:none;border-radius:4px;background:linear-gradient(#8a5a2a 0 45%,#f3b44a 45% 55%,#6b4a2a 55%);box-shadow:inset 0 0 0 2px #2a1c06}
.bundle{border-color:#7ff0ff;background:linear-gradient(135deg,#10282e,var(--panel) 60%)}
.bundle h2{color:#7ff0ff}
.slot{background-image:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc,transparent) 38%,transparent) 0,transparent 70%)!important}
.revive{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:3;white-space:nowrap;animation:pulse 1s steps(2) infinite;box-shadow:0 0 0 3px #000,0 0 16px rgba(243,180,74,.7)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto;font-size:.9rem}
.log li{display:flex;gap:8px;border-bottom:1px solid #1e2a30;padding:4px 0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
label.chk{display:flex;gap:8px;align-items:center}
select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

.overlay{position:fixed;inset:0;background:rgba(5,8,10,.78);display:grid;place-items:center;padding:20px;z-index:20}
.away{max-width:420px;width:100%;background:var(--panel);border:2px solid var(--lamp);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.away h2{color:var(--lamp);text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;background:var(--raise)}
.tiles b{display:block;font:700 1.2rem/1.1 var(--body);font-variant-numeric:tabular-nums}
.tiles small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.found{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.found li{display:flex;gap:8px;align-items:center;font-size:.9rem}
.found img{width:24px;height:24px;image-rendering:pixelated}

body.strip .top,body.strip .tabs,body.strip .panel{display:none}
body.strip .wrap{max-width:1400px}
body.strip .exitstrip{display:block}
@media (prefers-reduced-motion:reduce){.node.owned{box-shadow:none}}

/* ===== Phone game layout =====
   One screen: the scene on top, one wood console below it that holds the HUD, the icon bar and the menu,
   and the menu scrolls inside the console. Frames, planks and icons are pixel images drawn at start. */
:root{--wood:#2a1f17;--wood-deep:#120d0a;--wood-hi:#3a2b1f;--ink:#0b0d10;--plate:#f3d9a0}
html,body{height:100%;overflow:hidden;background:#07090b}
.wrap{max-width:480px;height:100%;padding:0;padding-top:env(safe-area-inset-top,0px);gap:0;margin:0 auto;display:flex;flex-direction:column}
.top{display:none}
.road{flex:none;border:0;border-radius:0;box-shadow:none}
.console{flex:1;min-height:0;display:flex;flex-direction:column;border:8px solid transparent;border-image:var(--frame) 4 / 8px repeat;background:var(--wood) var(--planks);background-size:32px 32px;image-rendering:pixelated;margin-top:-2px;padding-bottom:env(safe-area-inset-bottom,0px)}
.console > *{flex:none}
.console .hud{border:0;border-radius:0;background:transparent;padding:6px 8px 4px;gap:6px 10px}
.console .coach,.console .nudge{margin:2px 6px;border-radius:0;border:2px solid var(--lamp);background:#1b140f}
.console .tabs{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px;padding:4px 6px;border:0;border-top:2px solid #000;border-bottom:2px solid #000;box-shadow:inset 0 2px 0 var(--wood-hi);overflow:visible;background:rgba(0,0,0,.25)}
.console .panel{flex:1;min-height:0;overflow:auto;padding:8px 6px 16px;gap:8px}

  else if (f.kind === 'herb') blit(getSpr('basket', 0, 'basket'), ox + 8, oy + 9);

function pixelCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c.toDataURL(); }
function frameImage(hi, mid, lo, rivet) {
  return pixelCanvas(12, 12, x => {
    for (let j = 0; j < 12; j++) for (let i = 0; i < 12; i++) {
      const d = Math.min(i, j, 11 - i, 11 - j);
      if ((i === 0 || i === 11) && (j === 0 || j === 11)) continue;
      let c = null;
      if (d === 0 || d === 3) c = '#0b0d10'; else if (d === 1) c = (j === 1 || i === 1) && j !== 10 && i !== 10 ? hi : lo; else if (d === 2) c = mid;
      if (c) { x.fillStyle = c; x.fillRect(i, j, 1, 1); }
    }
    x.fillStyle = rivet; for (const [i, j] of [[1, 1], [10, 1], [1, 10], [10, 10]]) x.fillRect(i, j, 1, 1);
  });
}
function plankImage() {
  return pixelCanvas(16, 16, x => {
    for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
      const seam = j % 8 === 7 || (j < 8 ? i === 11 : i === 4), grain = (i * 7 + j * 3) % 11 === 0;
      x.fillStyle = seam ? '#1a120c' : grain ? '#33261c' : (j % 8 === 0 ? '#30241a' : '#2a1f17'); x.fillRect(i, j, 1, 1);
    }
  });
}
function buildLayout() {

}
